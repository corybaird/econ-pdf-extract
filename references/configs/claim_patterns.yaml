# 8-category empirical economics claim taxonomy, statistical guards, and attribution rules.

claim_types:
  forecast_accuracy:
    - '\boutperforms?\b'
    - '\b(?:lower|smaller|lowest|smallest|better|superior|higher|best)\s+(?:[\w-]+\s+){0,2}(?:prediction\s+errors?|forecast(?:ing)?\s+errors?|RMSE|MSE|MSPE|CRPS|MAE|QLIKE|reliability|sharpness|predictive\s+(?:accuracy|power|performance))\b'
    - '\b(?:dominates?|dominant\s+predictor|beats?)\b'
    - '\branks?\s+among\s+the\s+top\b'
    - '\bconsistently\s+rank(?:s|ing)?\s+among\b'
    - '\b(?:is|are)\s+preferred\s+(?:at|on|with|over|for)\b'
    - '\b(?:achieves?|attains?|delivers?|offers?|provides?|yields?)\s+(?:the\s+)?(?:best|highest|lowest|strong|good|better|superior|greater|substantial|significant)\s+(?:[\w-]+\s+){0,3}(?:reliability|sharpness|accuracy|performance|forecasts?|predictions?|gains?|predictive\s+(?:accuracy|power))\b'
    - '\bforecast(?:ing)?\s+(?:accuracy|performance)\s+(?:improves?|is\s+(?:strong|higher|better|superior)|remains?\s+(?:strong|competitive))\b'
    - '\b(?:improvement|gains?)\s+in\s+(?:[\w-]+\s+){0,3}(?:forecast(?:ing)?\s+(?:accuracy|performance)|predictability)\b'
    - '\b(?:well-calibrated\s+prediction\s+intervals?|highly\s+competitive|capable\s+of\s+providing\s+(?:good|strong|accurate)\s+[\w-]+\s+forecasts?|can\s+be\s+forecast(?:ed)?\s+accurately|accurately\s+forecasts?|anticipates?\s+the\s+(?:[\w-]+\s+){0,2}(?:contraction|recession|downturn|drop|surge))\b'
    - '\b(?:is|are)\s+(?:strongly\s+|highly\s+)?predictive\s+of\b'
    - '\b(?:R\s*\^?2\s*_?\s*oos|R2_?os)\b[^.]{0,50}?\b(?:positive|negative|exceeds?|reaches?|ranges?\s+from|less\s+negative)\b'
    - '\b(?:yields?|produces?)\s+(?:the\s+)?(?:highest|lowest)\s+(?:CRPS|RMSE|MSE|MAE)\b'
    - '\b(?:forecast\s+errors?|CRPS|RMSE|MSE)\s+(?:increase|decrease|fall|drop|rise)\s+(?:markedly|substantially|sharply|significantly)\b'
    - '\b(?:complementary|non-redundant)\s+(?:information|predictive)\b'
    - '\b(?:strong|dominant|robust)\s+predictor\b'
    - '\badded\s+value\s+for\s+predicting\b'
    - '\bperform(?:s)?\s+well\s+in\s+(?:real-time\s+|out-of-sample\s+|terms\s+of\s+)?(?:forecast(?:ing)?|capturing)\b'
    - '\bcombining\s+existing\s+\w+\s+can\s+improve\s+performance\b'
    - '\bmore\s+accurately\s+predict\b'

  magnitude:
    - '\b(?:explain|explains|capture|captures|account\s+for|reduce|reduces|reduced|reduction|increase[sd]?|falls?|rises?|drops?|declines?|deteriorates?|contracts?|expands?|peaks?|reaches?|troughs?|triggers?|experiences?)\b[^.]{0,45}?\b\d+(?:\.\d+)?\s*(?:%|percent|percentage\s+points?|p\.p\.|pp\b|basis[- ]points?|bps?\b|bp\b)'
    - '\brang(?:e|es|ing)\s+from\s+-?\d+(?:\.\d+)?\s*(?:%|percent|bp|bps|p\.p\.|pp)?\s+to\s+-?\d+(?:\.\d+)?\s*(?:%|percent|p\.p\.|pp\b|bps?\b)?'
    - '\b(?:rises?|increases?|falls?|drops?|declines?)\s+from\s+-?\d+(?:\.\d+)?\s*(?:%|percent|bp|bps|p\.p\.|pp)?\s+to\s+-?\d+(?:\.\d+)?\s*(?:%|percent|p\.p\.|pp\b|bps?\b)?'
    - '\b\d+(?:\.\d+)?[- ]?(?:basis[- ]points?|bps?\b|bp\b|percentage[- ]points?|p\.p\.|pp\b|%)\s+(?:[\w-]+\s+){0,3}(?:decline|drop|fall|increase|rise|hike|reduction|change|effect|response|spike)\b'
    - '\b(?:peak\s+effect|effect\s+size)\b[^.]{0,30}?\b(?:is|of|about|around)\s+-?\d+(?:\.\d+)?'
    - '\b(?:adjusted\s+R\s*\^?2|R-?squared|R\s*\^?2\s*_?\s*oos|R2_?os|CRPS|RMSE|MSE|MAE)\b[^.]{0,55}?(?:is|are|=|of|reaches?|reaching|exceeds?|ranges?\s+from|rises?\s+from|values?\s+[^.]{0,25}?\s+are)\s+-?\d+(?:\.\d+)?\s*%?'
    - '\b(?:several\s+times|nearly\s+twice|almost\s+twice|double|\d+\s+times\s+(?:longer|larger|higher|greater|smaller|lower))\b'
    - '\b(?:cumulative\s+)?variance\s+explained\b[^.]{0,45}?\d+(?:\.\d+)?\s*(?:%|percent)'
    - '\b(?:close\s+to|up\s+to|nearly|approximately|about|around|roughly|at\s+least|more\s+than|as\s+much\s+as)\s+\d+(?:\.\d+)?\s*(?:%|percent|percentage\s+points?|p\.p\.|pp\b|basis[- ]points?|bps?\b|bp\b)'
    - '\b\d+(?:\.\d+)?\s+to\s+\d+(?:\.\d+)?\s*(?:%|percent|percentage\s+points?|p\.p\.|pp\b|basis[- ]points?|bps?\b|bp\b)'
    - '\b(?:remained?|stays?|lies?)\s+(?:roughly\s+|approximately\s+)?between\s+(?!19\d\d|20\d\d)-?\d+(?:\.\d+)?\s*(?:%|percent|p\.p\.|pp\b|bps?\b)?\s+and\s+(?!19\d\d|20\d\d)-?\d+(?:\.\d+)?\b'
    - '\b(?:TUs?|Theil[''’]?s\s+U)\s+(?:are|is)\s+(?:all\s+)?(?:less|smaller|below)\s+than\s+(?:one|1(?:\.0)?)\b'
    - '\b(?:coefficient|estimate)\b[^.]{0,30}?\s+(?:is|of|=)\s*-?\d+(?:\.\d+)?'

  significance:
    - '\bstatistically\s+(?:and\s+economically\s+)?significant(?:ly)?\b'
    - '\bsignificantly\s+(?:predicts?|reduces?|improves?|increases?|decreases?|outperforms?|beats?|affects?|impacts?|higher|lower|greater|smaller|positive|negative|different|differs?|associated|related|explains?|lowers?|raises?)\b'
    - '\b(?:null\s+hypothesis|equal\s+(?:predictive|population-level)\s+(?:accuracy|predictability))\b[^.]{0,90}?\b(?:rejected|reject|fail(?:s|ing)?\s+to\s+reject)\b'
    - '\b(?:rejected|rejects?|reject)\s+(?:in\s+all\s+instances\s+|the\s+[\w-]+\s+benchmark\s+)?at\s+the\s+(?:0?\.\d+|1|5|10)\s*(?:%|percent)?\s*(?:significance\s+)?level\b'
    - '\bp-?values?\b[^.]{0,35}?(?:is|are|=|<|≤|of|equals?)\s*0?\.\d+'
    - '(?<![A-Za-z])p\s*(?:<|≤|=)\s*0?\.\d+'
    - '\bPr\s*=\s*(?:0?\.\d+|1\.0+)'
    - '\b(?:first[- ]stage\s+)?F[- ]stat(?:istic)?s?\b[^.]{0,55}?\b(?:is|are|of|=|exceeds?|above|below|reaches?)\s+\d+(?:\.\d+)?'
    - '\b(?:t|z|chi[- ]square|Wald|LM|LR|J|Hausman|Sargan|Hansen)[- ]stat(?:istic)?s?\b[^.]{0,40}?\b(?:is|are|of|=|exceeds?|above|below)\s+-?\d+(?:\.\d+)?'
    - '\b(?:credible|confidence|uncertainty|error|standard[- ]error|\d{2}%)\s+(?:band|interval)s?\b[^.]{0,55}?\b(?:excludes?|does\s+not\s+(?:include|contain)|lies?\s+(?:above|below))\s+zero\b'
    - '\b(?:Diebold[-–]Mariano|Clark[-–]West|Clark\s+and\s+West|Giacomini[-–]White|DM|CW|HW|CPA|MCS)\s+(?:test|table|statistic)\b'
    - '\bsignificant\s+(?:forecast(?:-accuracy)?\s+gains?|predictive\s+(?:power|accuracy|ability|gains?)|out-of-sample\s+gains?|improvements?|negative\s+effects?|positive\s+effects?|effects?|reductions?|gains?|predictability)\b'
    - '\bsignificant\s+at\s+the\s+(?:90|95|99|one|five|ten|1|5|10|0?\.\d+)\s*(?:%|percent)?\s*(?:significance|confidence)?\s*level\b'

  robustness:
    - '\brobust\s+(?:to|across|predictors?|findings?|results?)\b'
    - '\b(?:robustness\s+check|sensitivity\s+analysis|additional\s+experiments?)\b[^.]{0,55}?\b(?:confirms?|shows?|demonstrates?|indicates?|reveals?|lead(?:s|ing)?\s+to)\b'
    - '\b(?:holds?|persists?|consistent|remains?\s+(?:unchanged|valid|robust|strong))\s+(?:across|under|when|for)\s+(?:alternative|different|various|subsamples?|priors?|specifications?|ensemble|horizons?)\b'
    - '\b(?:finding|result)s?\s+(?:therefore\s+)?(?:also\s+)?holds?\s+(?:in|across|under|for|with)\b'
    - '\breproduction\s+is\s+(?:exact|identical|verified|confirmed|consistent)\b'
    - '\b(?:reproduc(?:e[sd]?|ing)|replicat(?:e[sd]?|ing)|match(?:es|ed|ing)?|recovers?)\s+(?:the\s+)?(?:original|published|author[''’]?s|headline|qualitative)\s+(?:results?|findings?|story|estimates?|output|code|numbers?|impulse\s+responses?|sign|magnitude)\b'
    - '\b(?:correctly|independently|closely)\s+(?:reproduced?|replicated?|matched|validated?|verified)\b'
    - '\b(?:quantitatively|qualitatively)\s+(?:similar|consistent|robust|unchanged)\b'
    - '\blead(?:s|ing)?\s+to\s+the\s+same\s+conclusions?\b'
    - '\bnot\s+driven\s+by\b'
    - '\b(?:jointly\s+necessary|neither\s+sufficient)\b'
    - '\bqualitative\s+results\s+hold\b'

  mechanism:
    - '\battributes?\s+[^.]{1,75}?\s+to\b'
    - '\b(?:primarily\s+|mainly\s+)?stems?\s+from\b'
    - '\btransmitted\s+through\b'
    - '\b(?:by\s+)?(?:decomposing|separating|decomposition)\b[^.]{0,75}?\b(?:reveals?|shows?|we\s+find|I\s+find|attributes?|identifies?)\b'
    - '\b(?:fundamental\s+)?trade-off\s+between\b'
    - '\bdriven\s+(?:primarily\s+|mainly\s+|largely\s+)?by\b'
    - '\b(?:reflecting|reflects)\s+the\s+(?:extreme|underlying|structural|economic)\b'
    - '\b(?:emerge|arises?)\s+in\s+the\s+wake\s+of\b'
    - '\boffers?\s+a\s+(?:scalable|parsimonious|hyperparameter-free)\b'
    - '\b(?:increase|increases|increased|decrease|decreases|decreased|raise|raises|raised|lower|lowers|lowered|reduce|reduces|reduced|dampen|dampens|boost|boosts|depress|depresses|expand|expands|contract|contracts|stimulate|stimulates|weaken|weakens|strengthen|strengthens|trigger|triggers|triggered)\s+(?:[\w-]+\s+){0,3}{macro_outcomes}\b'
    - '\b{macro_outcomes}\b[^.]{0,35}?\b(?:increase[sd]?|rises?|rose|falls?|fell|drops?|declines?|deteriorates?|contracts?|expands?|reverts?|persists?)\s+(?:by\s+|to\s+|around\s+|about\s+|sharply|markedly|substantially|significantly|persistently|mildly|slightly|strongly|more\s+than|above|below)'
    - '\b(?:has|have|had)\s+(?:the\s+)?(?:largest|strongest|smallest|weakest|most\s+powerful|larger|stronger|smaller|weaker|more\s+powerful|greater|outsized)\s+(?:[\w-]+\s+){0,2}(?:effects?|impacts?)\s+on\b'
    - '\b(?:respond|responds|responded|react|reacts|reacted)\s+(?:strongly|negatively|positively|significantly|sharply|markedly|sluggishly|more\s+strongly|more\s+negatively)\b'
    - '\b(?:pronounced|substantial|large|strong|persistent|transitory|statistically\s+significant)\s+(?:negative|positive)\s+(?:effects?|impacts?|responses?)\s+on\b'
    - '\b(?:market|price|yield|asset|macroeconomic)\s+response\s+(?:is|are)\s+(?:especially\s+|generally\s+)?(?:strong|negative|positive|pronounced|larger|smaller|significant)\b'
    - '\b(?:positive|negative)\s+(?:innovations?|shocks?|surprises?)\s+(?:to\s+[\w\s-]{1,30}?)?(?:increase|decrease|reduce|raise|lower|dampen|boost|depress|lead\s+to)\b'

  proposal:
    - '\b(?:we|I)\s+(?:propose|introduce|develop|establish|provide|document|benchmark|construct)\s+(?:the\s+|a\s+|an\s+|four\s+|three\s+|several\s+)?(?:simple\s+|parsimonious\s+|novel\s+|public\s+|new\s+|stylized\s+)?(?:design|benchmark|framework|method|model|database|dataset|measure|index|estimator|algorithm|approach|projection|facts?|replications?|companion|library|pipeline)\b'
    - '\b(?:our|my)\s+main\s+contribution\s+(?:is\s+that|is\s+to)\b'
    - '\bthis\s+(?:paper|study|article)\s+(?:proposes?|introduces?|establishes?|develops?|documents?|benchmarks?|demonstrates?\s+state-of-the-art)\b'
    - '\b(?:the\s+proposed|the\s+suggested)\s+(?:algorithm|method|approach|model|framework|benchmark|factor)\b[^.]{0,45}?\b(?:outperforms?|improves?|achieves?|remains?|is\s+robust|provides?)\b'

  negative_result:
    - '\b(?:do|does|did)\s+not\s+(?:significantly\s+|substantially\s+)?(?:predict|forecast|outperform|improve|beat|generate|deliver|add|provide|increase|decrease|rise|fall|respond|react)\b'
    - '\bfail(?:s|ed|ing)?\s+to\s+(?:outperform|beat|achieve|reject|generate|improve|predict)\b'
    - '\bfor\s+none\s+of\s+the\b'
    - '\b(?:predictability|performance|relationship|model)\s+breaks?\s+down\b'
    - '\bno\s+(?:statistically\s+)?significant\s+(?:predictive\s+power|gains?|improvement|evidence|effect)\b'
    - '\b(?:credible|confidence|uncertainty|error|standard[- ]error|\d{2}%)\s+(?:band|interval)s?\b[^.]{0,55}?\b(?:includes?|contains?|straddles?|spans?|encompasses?|covers?)\s+zero\b'
    - '\b(?:statistically\s+)?indistinguishable\s+from\s+zero\b'
    - '\bresponse\b[^.]{0,45}?\b(?:is|remains?)\s+(?:essentially\s+|statistically\s+)?(?:zero|insignificant)\b'
    - '\bno\s+longer\s+(?:clearly|statistically)\s+(?:positive|negative|significant)\b'
    - '\btoo\s+few\s+(?:profitable|observations|opportunities)\b'
    - '\bneither\s+sufficient\b'
    - '\b(?:fail|fails)\s+to\s+generate\s+(?:joint\s+)?predictive\s+value\b'

  economic_value:
    - '\btranslates?\s+into\s+(?:substantial\s+|significant\s+)?economic\s+(?:gains?|value|benefits?)\b'
    - '\b(?:highest|higher|greater|positive|improved)\s+(?:profit\s+per\s+trade|economic\s+(?:value|gains?)|utility|CER|Sharpe\s+ratio)\b'
    - '\bimproves?\s+the\s+economic\s+value\b'
    - '\b(?:portfolio|trading|arbitrage)\s+(?:gains?|value|profits?|evaluation)\b[^.]{0,55}?\b(?:achieve|improves?|higher|highest|profitable|too\s+few)\b'

general_finding_patterns:
  - '\b(?:we|I)\s+(?:find|show|demonstrate|document|confirm|conclude|estimate|establish)\s+that\b'
  - '\b(?:our|my|the)\s+(?:results?|findings?|estimates?|evidence)\s+(?:show|reveal|demonstrate|confirm|indicate|suggest|imply|establish)\s+that\b'
  - '\b(?:this\s+(?:paper|study|article)|it)\s+(?:shows?|has\s+shown|finds?|documents?|demonstrates?|establishes?)\s+that\b'

significance_context_patterns:
  - '\bstatistically\b'
  - '\bp-?values?\b'
  - '(?<![A-Za-z])p\s*(?:<|≤|=)\s*0?\.\d+'
  - '\b(?:t|z|F|Wald)-?stat(?:istic)?s?\b'
  - '\b(?:90|95|99|1|5|10|0?\.\d+)\s*(?:%|percent)?\s*(?:significance|confidence)\s+level\b'
  - '\b(?:credible|confidence|uncertainty)\s+(?:band|interval)s?\b'
  - '\bnull\s+hypothesis\b'
  - '\b(?:DM|CW|HW|CPA|MCS)\s+(?:test|table|statistic)\b'
  - '\bPr\s*=\s*(?:0?\.\d+|1\.0+)'
  - '\bsignificantly\s+(?:predicts?|reduces?|improves?|increases?|decreases?|outperforms?|affects?|impacts?|higher|lower|positive|negative)\b'

exclude_patterns:
  - '\b(?:remainder|rest)\s+of\s+(?:the|this)\s+(?:paper|article|study)\s+is\s+(?:organized|structured)\b'
  - '\b(?:the|this)\s+(?:paper|study|article)\s+is\s+(?:organized|structured)\s+as\s+follows\b'
  - '\bSection\s+\d+(?:\.\d+)?\s+(?:describes?|presents?|introduces?|reviews?|discusses?|outlines?|sets?\s+out|concludes?|turns?\s+to|shows?\s+results?\s+for)\b'
  - '\b(?:in\s+)?section\s+\d+(?:\.\d+)?[,\s]+(?:we|I)\s+(?:provide|present|give|offer|describe|introduce|explain|discuss|outline|review|turn\s+to|focus\s+on|examine|study)\b'
  - '\b(?:we|I)\s+(?:provide|give|offer)\s+an?\s+overview\s+of\b'
  - '\b(?:before\s+discussing|in\s+the\s+(?:next|following)\s+section)\b[^.]{0,60}?\b(?:we|I)\s+(?:provide|present|describe|give|discuss)\b'
  - '\b(?:we|I)\s+(?:organize|structure)\s+the\s+(?:paper|remainder)\b'
  - '\b(?:we|I)\s+conclude\s+in\s+section\s+\d+'
  - '\bdetails\s+(?:are|can\s+be)\s+(?:provided|found)\s+in\s+(?:the\s+)?Appendix\b'
  - '\bin\s+appendix\s+[A-Z0-9]+,\s+(?:we|I)\s+(?:provide|show|present|describe|report)\b'

attribution_patterns:
  citation: '[A-Z][A-Za-z\-''’\u00C0-\u024F]+(?:\s+(?:and|&)\s+[A-Z][A-Za-z\-''’\u00C0-\u024F]+|\s+et\s+al\.?)?\s*\(\s*(?:19|20)\d{2}[a-z]?\s*\)'
  own_work:
    - '\b(?:we|I)\s+(?:find|show|demonstrate|propose|provide|introduce|develop|document|confirm|conclude|report|suggest|decompose|estimate|construct|establish)\b'
    - '\b(?:our|my)\s+(?:main\s+)?(?:contribution|results?|findings?|approach|model|method|study|benchmark|estimates?|analysis|evidence)\b'
    - '\bthis\s+(?:paper|study|article)\b'
    - '\bthe\s+(?:proposed|suggested|extended)\s+(?:model|algorithm|method|approach|benchmark|specification|framework|factors?)\b'
  comparison:
    - '\boutperforms?\b'
    - '\bbeats?\b'
    - '\bcompared\s+(?:to|with|against)\b'
    - '\bin\s+line\s+with\b'
    - '\bconsistent\s+with\b'
    - '\bin\s+contrast\s+to\b'
    - '\bto\s+put\s+this\s+into\s+context\b'
    - '\bconfirm(?:s|ing)?\s+this\b'
    - '\brelative\s+to\b'
  literature_subject:
    - '^(?:(?:By\s+contrast|More\s+recently|In\s+related\s+work|For\s+example|Similarly|Specifically|However),?\s+)?(?:(?:Earlier|Early|Previous|Prior|Recent|Existing)\s+(?:studies|work|research|papers?)\s+(?:by|such\s+as|including)\s+)?[A-Z][A-Za-z\-''’\u00C0-\u024F]+(?:\s+(?:and|&)\s+[A-Z][A-Za-z\-''’\u00C0-\u024F]+|\s+et\s+al\.?)?\s*\(\s*(?:19|20)\d{2}[a-z]?\s*\)(?:\s*(?:,|and|&)\s*[A-Z][A-Za-z\-''’\u00C0-\u024F]+(?:\s+(?:and|&)\s+[A-Z][A-Za-z\-''’\u00C0-\u024F]+|\s+et\s+al\.?)?\s*\(\s*(?:19|20)\d{2}[a-z]?\s*\))*\s+(?:have\s+|also\s+)?(?:show|shows|showed|shown|find|finds|found|document|documents|documented|argue|argues|argued|report|reports|reported|conclude|concludes|concluded|demonstrate|demonstrates|demonstrated|note|notes|noted|point\s+out|suggest|suggests|suggested|observe|observes|observed|propose|proposes|proposed|obtain|obtains|obtained|estimate|estimates|estimated|emphasize|emphasizes|highlight|highlights|investigate|investigated|examine|examined|use|used)\b'
    - '^(?:(?:By\s+contrast|More\s+recently|Similarly|However),?\s+)?(?:They|The\s+authors?|Their\s+(?:results?|findings?|estimates?)|(?:[Ss]ome\s+)?(?:[Ee]arly|[Ee]arlier|[Pp]revious|[Pp]rior|[Ee]xisting|[Rr]ecent)\s+(?:studies|work|research|literature|papers?))\b'
