[project]
name = "econ-pdf-extract"
version = "0.1.0"
description = "Extract sections, formulas, and claims from economics paper PDFs"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Cory Baird", email = "corybaird@users.noreply.github.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pymupdf>=1.28.2,<2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.8,<4",
]

[project.scripts]
econ-pdf = "econ_pdf_extract.cli:entry"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econ_pdf_extract"]

# Listed one by one so a local gitignored papers.yaml is never packaged
[tool.hatch.build.targets.wheel.force-include]
"references/configs/claim_patterns.yaml" = "econ_pdf_extract/_references/configs/claim_patterns.yaml"
"references/configs/extraction.yaml" = "econ_pdf_extract/_references/configs/extraction.yaml"
"references/configs/math_patterns.yaml" = "econ_pdf_extract/_references/configs/math_patterns.yaml"
"references/configs/nlp_patterns.yaml" = "econ_pdf_extract/_references/configs/nlp_patterns.yaml"
"references/configs/papers.example.yaml" = "econ_pdf_extract/_references/configs/papers.example.yaml"
"references/configs/target_patterns.yaml" = "econ_pdf_extract/_references/configs/target_patterns.yaml"
"references/dictionaries/abbreviations.py" = "econ_pdf_extract/_references/dictionaries/abbreviations.py"
"references/dictionaries/greek_to_latex.py" = "econ_pdf_extract/_references/dictionaries/greek_to_latex.py"
"references/dictionaries/macro_outcomes.py" = "econ_pdf_extract/_references/dictionaries/macro_outcomes.py"
"references/dictionaries/math_fonts.py" = "econ_pdf_extract/_references/dictionaries/math_fonts.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/references/configs", "/references/dictionaries", "/README.md", "/LICENSE"]
exclude = ["/references/configs/papers.yaml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.urls]
Homepage = "https://github.com/corybaird/econ-pdf-extract"
Changelog = "https://github.com/corybaird/econ-pdf-extract/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/corybaird/econ-pdf-extract/blob/main/ROADMAP.md"
